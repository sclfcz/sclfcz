name: refresh merged PRs

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-merged-prs
  # Two triggers (push + schedule/dispatch) can overlap; the newer run has fresher data,
  # so let it win instead of racing the older one to the same commit.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Writes assets/stats.svg + assets/header-merged.svg as well: the badge image and
      # the numbers in the block come from the same run, so they cannot drift apart.
      - name: Render the merged-PR block and the local badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/render_merged_prs.py

      - name: Compare the profile pins with the merged list
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/check_pins.py --output pin-plan.txt

      - name: Commit if the data changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md assets; then
            echo "profile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "docs: refresh merged PR list [skip ci]"
          # A concurrent run may have pushed first; rebase and retry rather than failing.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing onto origin/main"
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push the refresh after 3 attempts" >&2
          exit 1

      # Pins have no API, so the run only leaves the order to apply by hand.
      - name: Upload the pin plan
        if: hashFiles('pin-plan.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pin-plan
          path: pin-plan.txt
          retention-days: 14
