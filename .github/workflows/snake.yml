name: contribution snake

# 把贡献图做成贪吃蛇动画（Platane/snk），产物推到 output 分支，README 直接引用，
# 不依赖任何第三方图片托管（vercel 之类在国内常打不开）。
#
# 手动触发：Actions → contribution snake → Run workflow
on:
  schedule:
    - cron: "23 3 * * *" # 每天一次，避开整点高峰
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
